<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>News List</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
 {% load static %}
    <link rel="stylesheet" href="{% static 'style.css' %}">
</head>
<body>
    <h1>Latest News</h1>
    <form method="get" class="form-inline mb-3">
    {{ form.status.label_tag }}
    {{ form.status }}
    <button type="submit" class="btn btn-primary ml-2">Фільтрувати</button>
</form>
    <br>
    <ul>
        {% for news in news_list %}
        <li>
            <a href="{% url 'news_detail' news.pk %}">{{ news.title }}</a>
            <p>{{ news.published_at }}</p>
            <p>Status: {{ news.get_status_display }}</p>

            {% if news.status == "DR" %}
                <form action="{% url 'news_publish' news.pk %}" method="post" style="display:inline;">
                    {% csrf_token %}
                    <button type="submit">Publish</button>
                </form>
            {% endif %}
        </li>
        {% endfor %}
    </ul>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js" integrity="sha384-IQsoLXl5PILFhosVNubq5LC7Qb9DXgDA9i+tQ8Zj3iwWAwPtgFTxbJ8NT4GN1R8p" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.min.js" integrity="sha384-cVKIPhGWiC2Al4u+LWgxfKTRIcfu0JTxR+EQDz/bgldoEyl4H0zUF0QKbrJ0EcQF" crossorigin="anonymous"></script>
</body>
</html>
